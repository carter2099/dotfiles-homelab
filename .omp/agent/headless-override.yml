# Headless-agent config overlay.
# Loaded via --config by provider-neutral scheduled omp calls.
# Daily News tool calls use the dedicated daily-news-headless.yml overlay.
# Decouples automated-agent config from interactive sessions:
# interactive toggles advisor via /advisor on/off in config.yml;
# enabled: false keeps automated runs free of advisor output.
advisor:
  enabled: false
  syncBacklog: off
# omp -p exits when the model ends its turn, so a backgrounded job's result is
# lost (2026-09-23: a hyperliquid run ended its turn waiting on a backgrounded
# integration suite and exited without committing). Keep headless shell work
# and subagents in the foreground.
async:
  enabled: false
bash:
  autoBackground:
    enabled: false
