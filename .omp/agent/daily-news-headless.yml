# Daily News headless-agent config.
# Keeps the digest search chain separate from other omp -p consumers.
advisor:
  enabled: false
  syncBacklog: off
# omp -p exits when the model ends its turn, so a backgrounded job's result is
# lost. Keep headless shell work and subagents in the foreground.
async:
  enabled: false
bash:
  autoBackground:
    enabled: false
# web_search tries each candidate in order and moves on when one is unavailable
# (no credential), errors (expired plan, quota, 401/403/429) or times out
# (providers.webSearchTimeoutSeconds, default 60 s): Codex search on the ChatGPT
# plan, then Claude search on the Claude plan, then local SearXNG. The chain is
# explicit, so nothing else is tried.
modelRoles:
  web: openai-codex/gpt-5.6-luna
retry:
  fallbackChains:
    web:
      - anthropic/claude-haiku-4-5
      - web/searxng
searxng:
  endpoint: http://localhost:8080
  categories: general,news
