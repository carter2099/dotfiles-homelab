worker_processes auto;
pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    server_tokens off;

    log_format concise '$remote_addr - $host "$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent"';
    access_log /dev/stdout concise;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    keepalive_requests 100;
    client_body_timeout 10;
    client_header_timeout 10;
    client_max_body_size 1m;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        server_name _;
        root /srv/news/current;
        index index.html;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /assets/ {
            try_files $uri =404;
            expires 5m;
        }

        location / {
            try_files $uri $uri/ =404;
            expires -1;
        }

        error_page 404 /404.html;
        location = /404.html {
            internal;
        }
    }
}
