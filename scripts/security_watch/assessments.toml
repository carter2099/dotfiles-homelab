# Verified not-affected assessments.
# An entry says `component` is not affected by `cves` and lists deterministic checks
# that prove the condition.  Entries are re-verified every scan: each check runs
# `argv` (inside `container` via `docker exec` when set) and passes only when it exits 0
# and the `expect` regex (Python re.search) matches stdout.  While every check passes,
# covered findings are downgraded to low with "verified not affected".  A failing check
# fails closed: the finding keeps its normal urgency and the failure is shown as a reason.
# Remove an entry when it no longer applies (the component changed or the CVE is fixed).
# Agents add entries only with checks that prove the condition; `verified` is the ISO
# date a human/agent last verified the reasoning.

[[not_affected]]
id = "openssh-sshole-glibc-nopassword"
component = "host"
cves = ["CVE-2026-123158"]
reason = "the sshole bypass needs sshd built without PAM on musl libc with password authentication; the host sshd links glibc (Ubuntu) and has PasswordAuthentication no and KbdInteractiveAuthentication no"
verified = "2026-11-09"

[[not_affected.checks]]
argv = ["ldd", "/usr/sbin/sshd"]
expect = 'libc\.so\.6'

[[not_affected.checks]]
argv = ["sudo", "-n", "sshd", "-T"]
expect = '(?m)^passwordauthentication no$'

[[not_affected.checks]]
argv = ["sudo", "-n", "sshd", "-T"]
expect = '(?m)^kbdinteractiveauthentication no$'

[[not_affected]]
id = "openssh-sshole-glibc-nopassword-rig"
component = "rig"
cves = ["CVE-2026-123158"]
reason = "the sshole bypass needs sshd built without PAM on musl libc with password authentication; the rig's Ubuntu sshd links glibc and has PasswordAuthentication no and KbdInteractiveAuthentication no (10-hardening.conf). One SSH call: while the rig is in Windows or asleep the check fails closed and the finding keeps its urgency"
verified = "2026-11-10"

[[not_affected.checks]]
argv = ["ssh", "-o", "BatchMode=yes", "-o", "ConnectTimeout=10", "-o", "ConnectionAttempts=1", "-o", "StrictHostKeyChecking=yes", "gamingrig-linux", "ldd /usr/sbin/sshd && sudo -n sshd -T"]
expect = '(?ms)\A(?=.*libc\.so\.6)(?=.*^passwordauthentication no$)(?=.*^kbdinteractiveauthentication no$)'

[[not_affected]]
id = "libxslt-news-xslt-module-not-loaded"
component = "news"
cves = ["CVE-2026-125350"]
reason = "libxslt is in the news image only as a dependency of the optional nginx XSLT module; the news nginx.conf loads no dynamic modules, so no running nginx process has libxslt mapped and the static site never parses XSLT"
verified = "2026-11-11"

[[not_affected.checks]]
container = "carter-news"
argv = ["sh", "-c", "pids=$(pidof nginx) && [ -n \"$pids\" ] || exit 1; for p in $pids; do [ -r /proc/$p/maps ] || exit 1; if grep -q -e libxslt -e libexslt /proc/$p/maps; then exit 1; fi; done; if grep -rqs load_module /etc/nginx/; then exit 1; fi; echo libxslt-not-loaded"]
expect = '^libxslt-not-loaded$'
