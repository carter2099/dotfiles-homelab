name: freshrss
services:
  freshrss:
    image: freshrss/freshrss:1.30.0@sha256:258b8edfc8a76a61f60d2d6a14d8f8d12495d78abf38646a2137612dfa264a21
    container_name: freshrss
    restart: unless-stopped
    environment:
      TZ: "UTC"
      CRON_MIN: "*/15"
    ports:
      - "127.0.0.1:30149:80"
    volumes:
      - ./data:/var/www/FreshRSS/data
    security_opt:
      - no-new-privileges:true
    # The entrypoint runs as root: it fixes data permissions (CHOWN, FOWNER,
    # DAC_READ_SEARCH to traverse the www-data-owned 0770 user dirs),
    # Apache binds :80 and drops to www-data (NET_BIND_SERVICE, SETUID,
    # SETGID), and cron's `su www-data` feed refresh needs SETUID/SETGID.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
      - DAC_READ_SEARCH
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/i/') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
