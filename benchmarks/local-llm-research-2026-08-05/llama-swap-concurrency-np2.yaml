    cmd: >-
      C:\llm\llama-server.exe -m C:\llm\Qwen_Qwen3.6-35B-A3B-Q8_0.gguf
      -ngl all --n-cpu-moe 33 --fit off -c 262144
      --flash-attn on --no-mmap -t 8 -tb 8
