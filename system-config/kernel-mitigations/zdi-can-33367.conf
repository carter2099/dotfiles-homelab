# ZDI-CAN-33367 stopgap (no CVE assigned yet): block modules the public
# local-privilege-escalation exploit needs.
#
# What: skb_zerocopy drops SKBFL_SHARED_FRAG (gap in the Dirty Frag
#   CVE-2026-43284 fix); public exploit since 2026-10-21, reproduced on
#   Ubuntu 24.04. Blocking esp4/esp6 (and nlmon, act_pedit) breaks the chain.
# Sources: https://almalinux.org/blog/2026-10-23-zdi-can-33367
#          https://www.sysdig.com/blog/detecting-and-mitigating-zdi-can-33367-and-five-other-linux-flaws
# Side effect: IPsec ESP (strongSwan/libreswan) stops working while this is
#   in place; install.sh refuses to apply if IPsec state/policy exists.
# Applied: 2026-11-01 (temporary).
# Remove when: Ubuntu ships a fixed kernel for ZDI-CAN-33367 (track the
#   USN/CVE once assigned) and it is running on this host:
#   sudo bash install.sh remove modules
# Installed to /etc/modprobe.d/zdi-can-33367.conf.

install esp4 /bin/false
install esp6 /bin/false
install nlmon /bin/false
install act_pedit /bin/false
