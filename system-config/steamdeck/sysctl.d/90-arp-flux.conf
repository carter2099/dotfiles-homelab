# Docked Steam Deck: wlan0 and the dock's USB Ethernet share 192.168.4.0/22.
# With the kernel default (arp_ignore=0) both interfaces answer ARP for both
# addresses, so the gaming rig mapped the Ethernet IP to the Wi-Fi MAC and sent
# the whole Moonlight stream over Wi-Fi (2026-11-02). Answer ARP only on the
# interface that owns the address, and source ARP requests from the outgoing
# interface's own address.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
