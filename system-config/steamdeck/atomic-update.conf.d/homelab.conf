# Homelab-managed /etc files that SteamOS atomic updates must keep.
# Without this, an update drops every /etc file not in
# /usr/lib/rauc/atomic-update-keep.conf (the 2026-10-23 update to 3.9.5 removed
# 10-hardening.conf and re-enabled SSH password logins).
/etc/ssh/sshd_config.d/10-hardening.conf
/etc/sysctl.d/90-arp-flux.conf
