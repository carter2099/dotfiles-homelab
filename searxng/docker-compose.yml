name: searxng

services:
  core:
    container_name: searxng
    image: docker.io/searxng/searxng@sha256:ba0a344c566ecc6e4429e81d02d93a01fa05c80e9fb6d08f0a1e57a729aa6d87
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 128
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./core-config/:/etc/searxng/:Z
      - core-data:/var/cache/searxng/
    networks:
      - default
      - chat-search          # shared with open-webui so 'searxng' hostname resolves in-app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  core-data:

networks:
  chat-search:
    external: true
    name: homelab-chat-search
