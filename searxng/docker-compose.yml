name: searxng

services:
  core:
    container_name: searxng
    image: docker.io/searxng/searxng@sha256:5ed0323b5f5f8701264ef65e239a2bd83cb57098f2b971fa30bf79c06eeae271
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 128
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./core-config/:/etc/searxng/:Z
      - core-data:/var/cache/searxng/
      # 2026-10 eMudhra CA compromise: use the host's patched trust store (dir = bundle + OpenSSL hash dir); remove once upstream image ships certifi >= 2026.10.19 and patched ca-certificates.
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - /etc/ssl/certs/ca-certificates.crt:/usr/local/searxng/.venv/lib/python3.14/site-packages/certifi/cacert.pem:ro
    networks:
      - default
      - chat-search          # shared with open-webui so 'searxng' hostname resolves in-app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  core-data:

networks:
  chat-search:
    external: true
    name: homelab-chat-search
